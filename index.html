<!doctype html>
<html lang="sv">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Admin Work Planner</title>
		<link rel="stylesheet" href="style.css" />
		<script src="script.js" defer></script>
	</head>
	<body>
		<header id="nav">
			<button id="signUp">Sign Up</button>
			<button id="signIn">Sign In</button>

			<div id="session-info">
				<span id="logged-user"></span>
				<span id="session-time">Session: 0s</span>
				<button id="logoutBtn">Logout</button>
			</div>
		</header>

		<form id="signUpForm" hidden>
			<div class="formDiv">
				<h2>Sign Up</h2>
				<label for="email">Email:</label>
				<input type="text" name="email" id="email" />

				<label for="password">Password:</label>
				<input type="password" name="password" id="password" />
				<label for="confirm">Confirm Password:</label>
				<input type="password" name="confirm" id="confirm" />
				<button type="submit" id="submitBtn">Create user</button>
				<p id="feedback"></p>
			</div>
		</form>

		<form id="signInForm" hidden>
			<div class="formDiv" id="login-step1">
				<h2>Sign in</h2>
				<label for="email2">Email:</label>
				<input type="text" name="email2" id="email2" />

				<label for="password2">Password:</label>
				<input type="password" name="password2" id="password2" />

				<button type="submit" id="submitBtn2">Continue</button>
				<p id="feedback2"></p>
			</div>

			<div class="formDiv" id="login-step2">
				<h2>Sign in - Step 2</h2>
				<p>Välj inloggningsmetod:</p>
				<button type="button" class="method-btn" data-method="Mobile BankID">
					Mobile BankID
				</button>
				<button type="button" class="method-btn" data-method="Security Token">
					Security Token
				</button>
			</div>
		</form>

		<main hidden id="main">
			<h1>Admin Work Planner</h1>

			<p>Antal tasks totalt: <strong id="count">0</strong></p>
			<p>Klara tasks: <strong id="done">0</strong></p>

			<section>
				<input type="number" id="search-id" placeholder="Sök på Task ID" />
				<button id="search-btn">Sök Task</button>
				<div id="search-result"></div>
			</section>

			<section style="margin: 15px 0">
				<button class="filter-btn" data-filter="all">Alla Tasks</button>
				<button class="filter-btn" data-filter="High">High Priority</button>
				<button class="filter-btn" data-filter="Medium">Medium Priority</button>
				<button class="filter-btn" data-filter="Low">Low Priority</button>
			</section>

			<section>
				<h2>Arbetsuppgifter</h2>
				<ul id="task-list"></ul>
			</section>
		</main>
	</body>
</html>
